<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Only root owns the helper's name; anyone may call it, and the helper
     checks every change with polkit. -->
<busconfig>
  <policy user="root">
    <allow own="io.github.rayytor.Sluis.Helper"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.github.rayytor.Sluis.Helper"/>
  </policy>
</busconfig>
