[workspace]
members = ["crates/core", "crates/scan", "crates/helper"]
resolver = "3"

[workspace.package]
version = "0.9.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/rayytor/sluis"

[package]
name = "sluis"
description = "Open websites your internet provider blocks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
futures-util = { version = "0.3", default-features = false }
gettext-rs = { version = "0.8", features = ["gettext-system"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sluis-core = { path = "crates/core" }
sluis-helper = { path = "crates/helper" }
zbus = "5"

[build-dependencies]
glib-build-tools = "0.22"

[profile.release]
lto = "thin"
