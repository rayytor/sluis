name: Website

on:
  push:
    branches: [main]
    paths:
      - website/**
      - data/screenshots/**
      - data/icons/hicolor/scalable/apps/io.github.rayytor.Sluis.svg

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir _site
          cp website/* _site/
          cp -r data/screenshots _site/
          cp data/icons/hicolor/scalable/apps/io.github.rayytor.Sluis.svg _site/icon.svg
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
